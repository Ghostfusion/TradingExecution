[project]
name = "trading-execution"
version = "0.1.0"
description = "Execution layer: signal daemon for the TradingAgents research-to-execution stack (Phase A: signals only, no orders)."
requires-python = ">=3.12"
dependencies = [
    "alpaca-py>=0.44",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "ruff"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"